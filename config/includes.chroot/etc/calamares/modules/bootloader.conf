# RSOS custom settings
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Bootloader configuration
#
---
efiBootLoader: "grub"

# HINWEIS (2026-11-10): Hier standen zusaetzlich kernel/img/fallback/timeout --
# Schluessel aus der 1.x-Reihe, die fuer GRUB nichts bewirken, aber das Schema
# verletzen (additionalProperties: false). Eine schema-widrige Datei verwirft
# Calamares still und arbeitet mit Vorgaben weiter. Entfernt.
efiBootloaderId: "rsos"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
