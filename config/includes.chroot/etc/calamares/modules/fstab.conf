# RSOS custom settings
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Configure fstab options
#
---
# HINWEIS (2026-11-10): Hier standen mountOptions, efiMountOptions und
# ssdExtraMountOptions. In Calamares 3.3 laesst das Schema dieser Datei nur
# crypttabOptions und tmpOptions zu -- die Einhaengeoptionen sind nach
# mount.conf gewandert (dortiger Schluessel "mountOptions", andere Schreibweise).
# Eine schema-widrige Datei verwirft Calamares still und arbeitet mit Vorgaben.
crypttabOptions: luks,keyscript=/bin/cat

tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
