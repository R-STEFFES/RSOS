# RSOS 2.0 -- Vorgabe fuer Standort und Zeitzone im Installer
#
# ⚠️ Diese Datei muss dem Schema entsprechen:
#     /usr/lib/x86_64-linux-gnu/calamares/modules/locale/locale.schema.yaml
# Es gilt "additionalProperties: false"; region und zone sind Pflicht.
#
# WARUM ES DIESE DATEI GIBT
# -------------------------
# Calamares bringt als Vorgabe mit:
#
#     region: America
#     zone:   New_York
#
# Eigentlich korrigiert die GeoIP-Abfrage das auf den richtigen Ort -- die
# braucht aber Netz. Im Live-System gibt es keins, also blieb es bei New York.
# Folge im Installer: "Das Format fuer Zahlen und Datum wird auf American
# English (United States) gesetzt." Auf einem deutschen System ist das falsch;
# ein Datum wie 11/10/2026 statt 10.11.2026 ist die Art Fehler, die spaeter
# niemand mehr zuordnen kann.
#
# Deshalb hier Berlin als Vorgabe. Die GeoIP-Abfrage bleibt eingeschaltet:
# Wer waehrend der Installation online ist, bekommt weiterhin seinen
# tatsaechlichen Ort vorgeschlagen und kann ihn auf der Seite aendern.
# Ohne Netz greift diese Vorgabe.
#
# Zum Nachpruefen im gebauten Abbild:
#     unsquashfs -cat <squashfs> etc/calamares/modules/locale.conf

---
region: "Europe"
zone: "Berlin"

# style: none wuerde die Abfrage abschalten -- hier bewusst nicht,
# siehe oben.
geoip:
    style: "json"
    url: "https://geoip.kde.org/v1/calamares"
    selector: ""
