# RSOS 2.0 -- Einhaengepunkte fuer das Zielsystem
#
# ⚠️ ACHTUNG: Diese Datei muss dem Schema des Moduls entsprechen:
#     /usr/lib/x86_64-linux-gnu/calamares/modules/mount/mount.schema.yaml
# Dort gilt "additionalProperties: false" -- ein einziger unbekannter Schluessel
# oder ein falscher Typ macht die GANZE Datei ungueltig. Calamares verwirft sie
# dann still: es mountet nur die Partitionen und KEINEN der Zusatzeinhaenge.
#
# WARUM DAS HIER FAST DIE GANZE INSTALLATION GEKOSTET HAETTE
# ----------------------------------------------------------
# Ohne /dev im Ziel bricht der Bootloader-Schritt ab mit
#
#     grub-install: error: cannot find a device for /boot/grub (is /dev mounted?)
#     -> Rueckgabewert 1
#
# Genau das ist passiert. In dieser Datei stand "options: bind" statt
# "options: [ bind ]" (das Schema verlangt eine Liste), und die EFI-Einhaengung
# lag unter dem Schluessel "extraMountsEfi", den das Schema nicht kennt.
# Ausserdem fehlte /dev/pts.
#
# Der Fehler ist schwer zu finden, weil Calamares ihn nicht meldet: im
# Protokoll steht nur "No extra mounts defined. Does mount.conf exist?".
#
# Vorlage ist die Datei aus dem Debian-Paket (calamares), hier mit den
# btrfs-Untervolumen der 1.x-Reihe als Zutat.

---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    # Nur bei UEFI: efi: true sorgt dafuer, dass der Eintrag im BIOS-Betrieb
    # weggelassen wird.
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log

# Einhaengeoptionen. Diese standen bis 2026-11-10 in fstab.conf -- dort laesst
# das Schema sie nicht mehr zu, hier gehoeren sie hin (andere Schreibweise:
# eine Liste von Eintraegen je Dateisystem).
#
# ⚠️ "default" gilt fuer ALLE Einhaengepunkte -- auch fuer die Zusatzeinhaenge
# weiter oben (proc, sys, /dev). Dort darf nichts stehen, was nur ein
# bestimmtes Dateisystem kennt. Genau daran ist die Installation gescheitert:
#
#     mount: /tmp/calamares-root-.../sys: fsconfig() failed:
#            sysfs: Unknown parameter 'nodiscard'.
#     WARNING: [PYTHON JOB]: "Cannot mount sys"
#
# Die Einhaeengeoptionen landen naemlich auch auf proc und sys, und sysfs
# verweigert dann den Dienst. Ohne /sys kann grub-install das Zielgeraet nicht
# aufloesen -- der Bootloader wird nie geschrieben, die Installation ist nicht
# startfaehig. Hier deshalb nur "defaults"; alles Weitere steht bei den
# Dateisystemen, die es verstehen.
mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: ext4
      options: [ defaults, noatime ]
      ssdOptions: [ discard ]
    - filesystem: btrfs
      options: [ defaults, noatime, noautodefrag ]
      ssdOptions: [ ssd ]
    - filesystem: xfs
      options: [ defaults, noatime ]
      ssdOptions: [ discard ]
    - filesystem: swap
      options: [ defaults ]
