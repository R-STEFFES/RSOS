---
# HINWEIS (2026-11-10): Hier stand "timers:" -- diesen Schluessel kennt das
# Schema von Calamares 3.3 nicht (es erlaubt nur "units" mit name/action/
# mandatory). Die Datei war damit ungueltig und wurde still verworfen; der
# fstrim-Zeitgeber wurde nie eingeschaltet. Jetzt als Einheit eingetragen.
units:
    - name: "fstrim.timer"
      action: "enable"
      mandatory: false
