# RSOS 2.0 -- Vorgaben fuer live-config
#
# Die Datei wird von /lib/live/init-config.sh eingelesen. Dort gilt die
# Reihenfolge:
#
#     1. Vorgaben des Skripts      LIVE_USER_FULLNAME="Debian Live user"
#     2. /etc/live/config.conf
#     3. /etc/live/config.conf.d/*.conf        <- diese Datei
#
# Sie ueberschreibt die Vorgabe also, weil sie danach gelesen wird. Das Skript
# arbeitet an dieser Stelle mit "set -o allexport", die Werte werden also
# exportiert und stehen dem spaeteren live-config (systemd) zur Verfuegung --
# genau dort laeuft 0030-user-setup und legt den Live-Benutzer an.
#
# Der BENUTZERNAME selbst kommt weiterhin von der Kernel-Kommandozeile
# (username=rsos in auto/config). Hier wird nur der angezeigte Name gesetzt:
# der erscheint in der Anmeldemaske von SDDM und in den Systemeinstellungen.

# Raphael wollte "RSOS Live user" statt "Debian Live user".
#
# Hinweis: dieser Wert laesst sich NICHT ueber die Kernel-Kommandozeile setzen,
# denn der Kernel trennt Parameter an Leerzeichen -- "user-fullname=RSOS Live
# user" kaeme als "RSOS" an. Deshalb steht er hier in der Konfigurationsdatei.
LIVE_USER_FULLNAME="RSOS Live user"

# Der Rechnername wird der Vollstaendigkeit halber mitgesetzt; er entspricht
# dem Wert der Kernel-Kommandozeile (hostname=rsos).
LIVE_HOSTNAME="rsos"
